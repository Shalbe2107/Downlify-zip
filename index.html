<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Downloader — Download Your Favorite Media Easily</title>
    <meta name="description" content="Quick Downloader is a modern, fast, and compliant media downloader and inspector web app. Analyze URLs, preview media, and download permitted audio, video, and image files." />
    <meta property="og:title" content="Quick Downloader — Download Your Favorite Media Easily" />
    <meta property="og:description" content="Quick Downloader is a modern, fast, and compliant media downloader and inspector web app. Analyze URLs, preview media, and download permitted audio, video, and image files." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // 1. Silent dummy WebSocket for Vite in sandboxed iframe environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (urlStr.indexOf('vite') !== -1 || urlStr.indexOf('localhost') !== -1 || urlStr.indexOf('run.app') !== -1 || urlStr.indexOf('127.0.0.1') !== -1) {
              return {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                readyState: 1, // OPEN
                url: urlStr,
                onclose: null,
                onerror: null,
                onmessage: null,
                onopen: null,
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Intercept console outputs for any leftover Vite WebSocket logs
        var origError = console.error;
        var origWarn = console.warn;
        var origDebug = console.debug;
        var filterMsg = function(args) {
          try {
            var msg = Array.prototype.join.call(args, ' ');
            return msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1;
          } catch(e) {
            return false;
          }
        };

        console.error = function() {
          if (filterMsg(arguments)) return;
          return origError.apply(console, arguments);
        };
        console.warn = function() {
          if (filterMsg(arguments)) return;
          return origWarn.apply(console, arguments);
        };
        console.debug = function() {
          if (filterMsg(arguments)) return;
          return origDebug.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(e) {
          var str = String((e && e.reason && (e.reason.message || e.reason.stack || e.reason)) || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('vite') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(e) {
          var str = String((e && (e.message || e.error)) || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('vite') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-purple-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
